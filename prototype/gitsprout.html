<title>Gitsprout</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600&family=JetBrains+Mono:wght@400;500&family=Unbounded:wght@600&display=swap">
<style>
/* Layout: one desktop window — refs sidebar | commit graph (or diff) | working panel; dark-first like a dev tool */
:root {
  --bg: #0d0f15;
  --surface: #131620;
  --raise: #1a1e2b;
  --line: #252a3b;
  --fg: #e3e6f0;
  --muted: #8a90a9;
  --faint: #596079;
  --accent: #9bd36a;
  --on-accent: #0f1a08;
  --ok: #4fd1c0;
  --warn: #f2c14e;
  --bad: #ff5d73;
  --add: rgba(79, 209, 192, .12);
  --del: rgba(255, 93, 115, .12);
  --sel: rgba(155, 211, 106, .09);
  --hover: rgba(255, 255, 255, .035);
  --l0: #5cc8ff; --l1: #b18cff; --l2: #ff8a65; --l3: #f2c14e; --l4: #4fd1c0; --l5: #ff6fb5;
  --ui: 'Onest', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --mono: 'JetBrains Mono', ui-monospace, 'SF Mono', Menlo, monospace;
  --display: 'Unbounded', 'Onest', system-ui, sans-serif;
  color-scheme: dark;
}
@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) {
    --bg: #eef0f5; --surface: #ffffff; --raise: #f4f5f9; --line: #dde0ea;
    --fg: #1a1d29; --muted: #5c6280; --faint: #9095ad;
    --accent: #3d8b2c; --on-accent: #ffffff;
    --ok: #0f8f80; --warn: #b07c00; --bad: #d63350;
    --add: rgba(15, 143, 128, .1); --del: rgba(214, 51, 80, .09); --sel: rgba(61, 139, 44, .08); --hover: rgba(20, 25, 50, .035);
    --l0: #1a8ccc; --l1: #7a55e0; --l2: #df5a35; --l3: #b88600; --l4: #0f8f80; --l5: #cf3d8a;
    color-scheme: light;
  }
}
:root[data-theme="light"] {
  --bg: #eef0f5; --surface: #ffffff; --raise: #f4f5f9; --line: #dde0ea;
  --fg: #1a1d29; --muted: #5c6280; --faint: #9095ad;
  --accent: #3d8b2c; --on-accent: #ffffff;
  --ok: #0f8f80; --warn: #b07c00; --bad: #d63350;
  --add: rgba(15, 143, 128, .1); --del: rgba(214, 51, 80, .09); --sel: rgba(61, 139, 44, .08); --hover: rgba(20, 25, 50, .035);
  --l0: #1a8ccc; --l1: #7a55e0; --l2: #df5a35; --l3: #b88600; --l4: #0f8f80; --l5: #cf3d8a;
  color-scheme: light;
}

* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--fg);
  font: 13px/1.4 var(--ui); padding-inline: 16px; padding-block: 16px;
  -webkit-font-smoothing: antialiased;
}
button, input, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.mono { font-family: var(--mono); font-size: 12px; }
svg { flex: none; }

.app {
  height: 100%; display: grid; grid-template-rows: auto auto minmax(0, 1fr) auto;
  background: var(--surface); border: 1px solid var(--line); border-radius: 12px; overflow: hidden;
}

/* title bar */
.titlebar { display: flex; align-items: center; gap: 14px; padding: 0 12px; height: 40px; border-bottom: 1px solid var(--line); background: var(--bg); min-width: 0; }
.lights { display: flex; gap: 7px; }
.lights i { width: 11px; height: 11px; border-radius: 50%; background: var(--line); }
.brand { display: flex; align-items: center; gap: 7px; color: var(--accent); }
.brand b { font-family: var(--display); font-weight: 600; font-size: 13px; letter-spacing: .02em; color: var(--fg); }
.tabs { display: flex; gap: 2px; min-width: 0; overflow-x: auto; scrollbar-width: none; }
.tab { display: flex; align-items: center; gap: 6px; border: 0; background: none; padding: 6px 12px; border-radius: 7px; color: var(--muted); white-space: nowrap; }
.tab:hover { background: var(--hover); color: var(--fg); }
.tab.on { background: var(--surface); color: var(--fg); box-shadow: inset 0 0 0 1px var(--line); }
.tab.add { padding: 6px 9px; }

/* toolbar */
.toolbar { display: flex; align-items: center; gap: 14px; padding: 8px 12px; border-bottom: 1px solid var(--line); min-width: 0; flex-wrap: wrap; }
.crumb { display: flex; flex-direction: column; gap: 1px; border: 0; background: none; padding: 2px 6px; border-radius: 6px; text-align: left; }
.crumb:hover { background: var(--hover); }
.crumb .lbl { font-size: 10px; letter-spacing: .08em; text-transform: uppercase; color: var(--faint); }
.crumb b { font-weight: 600; font-size: 14px; display: flex; align-items: center; gap: 5px; }
.tgroup { display: flex; gap: 2px; padding-left: 14px; border-left: 1px solid var(--line); }
.tbtn { position: relative; display: flex; align-items: center; gap: 6px; border: 0; background: none; padding: 7px 10px; border-radius: 7px; color: var(--muted); }
.tbtn:hover { background: var(--hover); color: var(--fg); }
.tbtn:disabled { opacity: .4; cursor: default; background: none; }
.badge { font-style: normal; font-size: 10px; font-weight: 600; min-width: 17px; padding: 1px 5px; border-radius: 9px; background: var(--accent); color: var(--on-accent); font-variant-numeric: tabular-nums; }
.badge:empty { display: none; }
.spacer { flex: 1; }
.proto { font-size: 11px; color: var(--faint); border: 1px dashed var(--line); padding: 3px 8px; border-radius: 6px; white-space: nowrap; }
.side-toggle { display: none; }

/* main grid */
.main { display: grid; grid-template-columns: 250px minmax(0, 1fr) 360px; min-height: 0; }
.side, .panel { min-height: 0; overflow: auto; }
.side { border-right: 1px solid var(--line); padding: 10px 8px 16px; display: flex; flex-direction: column; gap: 6px; }
.panel { border-left: 1px solid var(--line); display: flex; flex-direction: column; }

.filter { display: flex; align-items: center; gap: 6px; background: var(--bg); border: 1px solid var(--line); border-radius: 7px; padding: 5px 8px; color: var(--faint); margin-bottom: 4px; }
.filter input { border: 0; background: none; outline: none; width: 100%; min-width: 0; }
.filter input::placeholder { color: var(--faint); }
.filter kbd { font: 10px var(--mono); color: var(--faint); }

details.sec > summary { list-style: none; display: flex; align-items: center; gap: 6px; padding: 6px 6px; font-size: 11px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); cursor: pointer; border-radius: 6px; }
details.sec > summary::-webkit-details-marker { display: none; }
details.sec > summary:hover { background: var(--hover); }
details.sec > summary .chev { transition: transform .15s; }
details.sec[open] > summary .chev { transform: rotate(90deg); }
details.sec > summary .n { margin-left: auto; font-weight: 500; color: var(--faint); font-variant-numeric: tabular-nums; }
.folder { display: flex; align-items: center; gap: 6px; padding: 4px 8px 4px 22px; color: var(--faint); font-size: 12px; }
.ref { display: flex; align-items: center; gap: 7px; padding: 4px 8px 4px 22px; border-radius: 6px; color: var(--fg); cursor: default; user-select: none; min-width: 0; }
.ref.in { padding-left: 38px; }
.ref:hover { background: var(--hover); }
.ref.on { background: var(--sel); box-shadow: inset 2px 0 0 var(--accent); }
.ref .nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.ref .ic { color: var(--faint); }
.ref.on .ic { color: var(--accent); }
.ref .ab { margin-left: auto; display: flex; gap: 4px; font: 11px var(--mono); color: var(--muted); font-variant-numeric: tabular-nums; }
.ref .ab .up { color: var(--ok); }
.ref .ab .dn { color: var(--warn); }
.ref .sub { color: var(--faint); font-size: 11px; }
.empty-note { padding: 4px 8px 4px 22px; color: var(--faint); font-size: 12px; }

/* center */
.center { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
.ghead { display: flex; align-items: center; gap: 10px; padding: 8px 12px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.ghead .filter { margin: 0; width: 240px; max-width: 100%; }
.chip { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); background: none; border-radius: 999px; padding: 4px 10px; color: var(--muted); font-size: 12px; }
.chip:hover { color: var(--fg); }
.chip[aria-pressed="true"] { border-color: var(--accent); color: var(--accent); background: var(--sel); }
.viewing { margin-left: auto; color: var(--faint); font-size: 12px; font-variant-numeric: tabular-nums; }

.gcols, .row { display: grid; grid-template-columns: 150px var(--gw, 60px) minmax(0, 1fr) 118px 54px 66px; align-items: center; column-gap: 10px; }
.gcols { padding: 5px 12px; font-size: 10px; letter-spacing: .08em; text-transform: uppercase; color: var(--faint); border-bottom: 1px solid var(--line); }
.gscroll { overflow: auto; flex: 1; min-height: 0; padding-bottom: 12px; }
.row { height: 30px; padding: 0 12px; cursor: default; user-select: none; }
.row:hover { background: var(--hover); }
.row.sel { background: var(--sel); }
.row.dim { opacity: .28; }
.row svg { display: block; }
.refs { display: flex; gap: 4px; min-width: 0; justify-content: flex-end; }
.pill { display: inline-flex; align-items: center; gap: 4px; max-width: 100%; padding: 1px 7px; border-radius: 5px; font-size: 11.5px; border: 1px solid var(--c); background: color-mix(in srgb, var(--c) 16%, transparent); color: var(--fg); white-space: nowrap; overflow: hidden; }
.pill span { overflow: hidden; text-overflow: ellipsis; }
.pill.head { background: var(--c); color: var(--bg); font-weight: 600; }
.pill.more { flex: none; border-color: var(--line); background: none; color: var(--muted); }
.msg { display: flex; align-items: center; gap: 6px; min-width: 0; white-space: nowrap; }
.msg .t { overflow: hidden; text-overflow: ellipsis; }
.msg.merge .t, .msg.ci .t { color: var(--muted); }
.jira { flex: none; font: 500 11px var(--mono); padding: 1px 6px; border-radius: 4px; background: var(--raise); color: var(--fg); text-decoration: none; border: 1px solid var(--line); }
a.jira:hover { border-color: var(--accent); color: var(--accent); }
.kind { flex: none; font-size: 9.5px; font-weight: 600; letter-spacing: .07em; color: var(--muted); }
.kind.FIX { color: var(--bad); } .kind.FEAT, .kind.FEATURE { color: var(--ok); } .kind.DOCS { color: var(--l0); } .kind.UPDATE { color: var(--warn); }
.wipmsg { color: var(--accent); font-style: italic; }
.who { display: flex; align-items: center; gap: 6px; min-width: 0; color: var(--muted); font-size: 12px; }
.who span:last-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.av { flex: none; width: 18px; height: 18px; border-radius: 50%; display: grid; place-items: center; font-size: 8.5px; font-weight: 600; color: var(--bg); background: var(--c); }
.when, .sha { color: var(--faint); font-size: 12px; font-variant-numeric: tabular-nums; }
.sha { font-family: var(--mono); font-size: 11.5px; }

/* diff */
.diffview { display: flex; flex-direction: column; min-height: 0; flex: 1; }
.dhead { display: flex; align-items: center; gap: 10px; padding: 8px 12px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.dhead .path { font: 12.5px var(--mono); min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.dhead .path .dir { color: var(--muted); }
.dbody { overflow: auto; flex: 1; min-height: 0; font: 12px/1.6 var(--mono); padding-bottom: 16px; }
.dl { display: grid; grid-template-columns: 44px 44px 16px max-content; white-space: pre; }
.dl .no { color: var(--faint); text-align: right; padding-right: 8px; user-select: none; font-variant-numeric: tabular-nums; }
.dl .sg { color: var(--faint); user-select: none; }
.dl.a { background: var(--add); } .dl.a .sg { color: var(--ok); }
.dl.d { background: var(--del); } .dl.d .sg { color: var(--bad); }
.dl.h { color: var(--l1); background: var(--raise); margin-top: 6px; }
.dl.h:first-child { margin-top: 0; }
.dl.note { color: var(--faint); font-style: italic; }
.bin { padding: 40px 16px; color: var(--muted); text-align: center; font-family: var(--ui); }

/* panel */
.phead { display: flex; align-items: center; gap: 8px; padding: 12px 14px; border-bottom: 1px solid var(--line); min-height: 46px; flex-wrap: wrap; }
.phead .grow { flex: 1; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; border: 1px solid var(--line); background: var(--raise); border-radius: 7px; padding: 6px 11px; font-size: 12.5px; white-space: nowrap; }
.btn:hover { border-color: var(--faint); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); font-weight: 600; }
.btn.primary:hover { filter: brightness(1.06); }
.btn.danger { color: var(--bad); }
.btn.danger.primary { background: var(--bad); border-color: var(--bad); color: #fff; }
.btn:disabled { opacity: .45; cursor: default; filter: none; }
.btn.sm { padding: 3px 8px; font-size: 11.5px; }
.btn.ghost { background: none; border-color: transparent; color: var(--muted); }
.btn.ghost:hover { color: var(--fg); background: var(--hover); }

.psec { padding: 6px 6px 10px; border-bottom: 1px solid var(--line); }
.psec-h { display: flex; align-items: center; gap: 8px; padding: 6px 8px; font-size: 11px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.psec-h .btn { margin-left: auto; text-transform: none; letter-spacing: 0; font-weight: 500; }
.file { display: grid; grid-template-columns: 18px minmax(0, 1fr) auto auto; align-items: center; gap: 8px; padding: 4px 8px; border-radius: 6px; cursor: default; }
.file:hover { background: var(--hover); }
.file.on { background: var(--sel); }
.file .p { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 12.5px; direction: rtl; text-align: left; }
.file .p bdi { direction: ltr; }
.file .p .dir { color: var(--faint); }
.st { font: 600 10px var(--mono); width: 16px; height: 16px; display: grid; place-items: center; border-radius: 4px; }
.st.M { color: var(--warn); background: color-mix(in srgb, var(--warn) 14%, transparent); }
.st.A { color: var(--ok); background: color-mix(in srgb, var(--ok) 14%, transparent); }
.st.D { color: var(--bad); background: color-mix(in srgb, var(--bad) 14%, transparent); }
.cnt { font: 11px var(--mono); color: var(--faint); font-variant-numeric: tabular-nums; }
.cnt .p1 { color: var(--ok); } .cnt .m1 { color: var(--bad); }
.file .btn { opacity: 0; }
.file:hover .btn, .file .btn:focus-visible { opacity: 1; }
.none { padding: 6px 10px 4px; color: var(--faint); font-size: 12px; }

.commitbox { margin-top: auto; padding: 12px 14px 14px; border-top: 1px solid var(--line); display: flex; flex-direction: column; gap: 8px; background: var(--bg); }
.field { position: relative; }
.field input, .field textarea { width: 100%; background: var(--surface); border: 1px solid var(--line); border-radius: 7px; padding: 8px 10px; outline: none; resize: vertical; }
.field input { padding-right: 38px; font-weight: 500; }
.field input:focus, .field textarea:focus { border-color: var(--accent); }
.field .left { position: absolute; right: 9px; top: 9px; font: 11px var(--mono); color: var(--faint); font-variant-numeric: tabular-nums; }
.field .left.over { color: var(--bad); }
.check { display: flex; align-items: center; gap: 7px; color: var(--muted); font-size: 12.5px; }
.check input { accent-color: var(--accent); }
.cbtns { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
.hint { font-size: 11.5px; color: var(--faint); min-height: 1em; }

.ctitle { padding: 14px 14px 4px; font-size: 15px; font-weight: 600; line-height: 1.35; text-wrap: balance; display: flex; flex-wrap: wrap; gap: 6px; align-items: baseline; }
.cbody { padding: 4px 14px 0; color: var(--muted); white-space: pre-wrap; }
.meta { display: grid; grid-template-columns: 74px minmax(0, 1fr); gap: 7px 10px; padding: 12px 14px 14px; font-size: 12.5px; border-bottom: 1px solid var(--line); }
.meta dt { color: var(--faint); }
.meta dd { margin: 0; display: flex; gap: 6px; flex-wrap: wrap; align-items: center; min-width: 0; }
.link { border: 0; background: none; padding: 0; color: var(--accent); font: 12px var(--mono); }
.link:hover { text-decoration: underline; }

/* status bar */
.status { display: flex; align-items: center; gap: 14px; padding: 5px 12px; border-top: 1px solid var(--line); font-size: 11.5px; color: var(--faint); background: var(--bg); min-width: 0; overflow: hidden; white-space: nowrap; }
.status b { color: var(--muted); font-weight: 500; }
.status .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--ok); display: inline-block; margin-right: 6px; }
.status .dot.dirty { background: var(--warn); }

/* context menu, modal, toasts */
.ctx { position: fixed; z-index: 30; min-width: 220px; background: var(--raise); border: 1px solid var(--line); border-radius: 9px; padding: 5px; box-shadow: 0 12px 32px rgba(0, 0, 0, .35); }
.ctx button { display: flex; width: 100%; align-items: center; gap: 8px; border: 0; background: none; padding: 6px 10px; border-radius: 6px; text-align: left; font-size: 12.5px; }
.ctx button:hover:not(:disabled) { background: var(--sel); color: var(--accent); }
.ctx button:disabled { color: var(--faint); cursor: default; }
.ctx button.danger:not(:disabled) { color: var(--bad); }
.ctx .later { margin-left: auto; font-size: 10px; border: 1px solid var(--line); border-radius: 4px; padding: 0 5px; }
.ctx hr { border: 0; border-top: 1px solid var(--line); margin: 4px 2px; }
.scrim { position: fixed; inset: 0; z-index: 40; background: rgba(5, 7, 12, .5); display: grid; place-items: center; padding: 16px; }
.modal { width: min(420px, 100%); background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 18px; display: flex; flex-direction: column; gap: 12px; box-shadow: 0 20px 50px rgba(0, 0, 0, .4); }
.modal h3 { margin: 0; font-size: 15px; }
.modal p { margin: 0; color: var(--muted); }
.modal .field input { padding-right: 10px; font-family: var(--mono); font-size: 12.5px; font-weight: 400; }
.modal .err { color: var(--bad); font-size: 12px; min-height: 1em; }
.m-actions { display: flex; justify-content: flex-end; gap: 8px; }
.toasts { position: fixed; right: 28px; bottom: 44px; z-index: 50; display: flex; flex-direction: column; gap: 8px; align-items: flex-end; pointer-events: none; }
.toast { background: var(--raise); border: 1px solid var(--line); border-left: 3px solid var(--ok); border-radius: 8px; padding: 9px 13px; max-width: 380px; box-shadow: 0 10px 28px rgba(0, 0, 0, .3); animation: tin .18s ease-out; }
.toast.warn { border-left-color: var(--warn); } .toast.bad { border-left-color: var(--bad); }
@keyframes tin { from { transform: translateY(6px); opacity: 0; } }
@media (prefers-reduced-motion: reduce) { .toast { animation: none; } details.sec > summary .chev { transition: none; } }

/* responsive */
@media (max-width: 1280px) {
  .main { grid-template-columns: 220px minmax(0, 1fr) 320px; }
  .gcols, .row { grid-template-columns: 120px var(--gw, 60px) minmax(0, 1fr) 54px 66px; }
  .c-who { display: none; }
}
@media (max-width: 960px) {
  body { height: auto; }
  html { height: auto; }
  .app { height: auto; }
  .main { grid-template-columns: minmax(0, 1fr); }
  .side { display: none; border-right: 0; border-bottom: 1px solid var(--line); max-height: 50vh; }
  .app.side-open .side { display: flex; }
  .side-toggle { display: flex; }
  .center { height: 62vh; }
  .panel { border-left: 0; border-top: 1px solid var(--line); }
  .tbtn span:not(.badge) { display: none; }
  .proto { display: none; }
}
@media (max-width: 600px) {
  .gcols, .row { grid-template-columns: 84px var(--gw, 60px) minmax(0, 1fr); column-gap: 8px; }
  .c-when, .c-sha { display: none; }
  .tgroup { padding-left: 8px; }
  .toolbar { gap: 8px; }
  .titlebar .lights { display: none; }
  .ghead .filter { width: 100%; }
  .viewing { margin-left: 0; }
}
</style>

<div class="app" id="app">
  <header class="titlebar">
    <div class="lights" aria-hidden="true"><i></i><i></i><i></i></div>
    <div class="brand">
      <svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21V11.5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><path d="M12 13.5C12 9 9 6.5 4.5 6.5c0 4.5 3 7 7.5 7z" fill="currentColor"/><path d="M12 11c0-4 2.6-7.5 7.5-7.5 0 4.5-3 7.5-7.5 7.5z" fill="currentColor" opacity=".7"/><circle cx="12" cy="20" r="2.3" fill="currentColor"/></svg>
      <b>gitsprout</b>
    </div>
    <nav class="tabs" id="tabs" aria-label="Repositories"></nav>
  </header>

  <div class="toolbar">
    <button class="tbtn side-toggle" data-act="toggle-side" aria-label="Show branches"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M2 4h12M2 8h12M2 12h12"/></svg></button>
    <button class="crumb" data-act="focus-filter"><span class="lbl">repository</span><b>Pilot7</b></button>

const POOL = {
  php: ["$payload = $this->builder->build($job);", "$this->log->info('push sent', ['token' => $token]);", "if ($response->status === 429) {", "    return $this->requeue($job, delay: 30);", "}", "$job->attempts++;", "$tokens = $this->devices->tokensFor($job->userId);", "return $result;", "$fee = max(0, $next->fee - $prev->fee);", "$reservation->fuel = $transfer->fuel;"],
  ts: ["const window = useProcessingWindow(roomId);", "if (!window.isOpen) return null;", "export const PROCESSING_WINDOW_MS = 15 * 60 * 1000;", "setAlgorithmState({ ...state, window });", "return <MapContainer hideControls={hideControls} />;", "await api.reservations.update(id, payload);", "const columns = useAgreementColumns(form);", "}"],
  json: ['"version": "1.8.7",', '"build": 4182,', '"fluids.report.title": "Fluids",', '"fluids.report.volume": "Volume, l",', '"objects.add.title": "Add object",'],
  md: ['## Stage 5: watchOS widget push', '- APNs topic: `com.pilot.pulse.widget`', '- Retry on 429 with a 30 s delay', 'Accepted on 2026-09-29.', '', '### Prerequisites'],
};
function fakeDiff(path, add, del, seed) {
  const ext = path.split('.').pop();
  const pool = POOL[ext === 'tsx' || ext === 'js' ? 'ts' : ext] || POOL.ts;
  let k = parseInt(seed.slice(0, 4), 16) || 7;
  const pick = () => pool[(k = (k * 31 + 7) % 9973) % pool.length];
  const start = add && !del ? 1 : 10 + (k % 80);
  const lines = [];
  const da = Math.min(del, 10), aa = Math.min(add, 12);
  lines.push(`@@ -${del || add ? start : 0},${del + (del ? 4 : 0)} +${start},${add + (del ? 4 : 0)} @@`);
  if (del) lines.push(' ' + pick(), ' ' + pick());
  for (let i = 0; i < da; i++) lines.push('-' + pick());
  for (let i = 0; i < aa; i++) lines.push('+' + pick());
  if (del) lines.push(' ' + pick(), ' ' + pick());
  if (add > aa || del > da) lines.push(`~… ${add - aa + del - da} more changed lines in the full diff`);
  return lines;
}

function renderDiff() {

  d.innerHTML = `

function doCommit(thenPush) {
  const s = S.draft.summary.trim(); if (!s) return;
  const files = S.wip.staged.map(f => { const [a, d] = f.bin ? [0, 0] : counts(f.diff); return [f.path, f.st, a, d]; });
  const msg = s;
  if (S.draft.amend) {
    const c = MAP[headSha()];
    const pushed = Object.values(S.remotes).some(r => reach(r).has(c.sha));
    const ns = rnd(); renameSha(c.sha, ns);
    c.msg = msg; c.body = S.draft.desc.trim(); c.files = c.files.concat(files); c.ago = 0;
    toast(`Amended <b>${ns}</b>${pushed ? ' · it was already pushed, so the next push needs --force-with-lease' : ''}`, pushed ? 'warn' : '');
  } else {
    const c = newCommit(msg, files, [headSha()]); c.body = S.draft.desc.trim();
    S.heads[S.HEAD] = c.sha;
    toast(`Committed <b>${c.sha}</b> on ${esc(S.HEAD)}`);
  }
  S.wip.staged = []; S.draft = { summary: '', desc: '', amend: false };
  S.sel = dirty() ? 'WIP' : headSha(); S.diff = null; render();
  if (thenPush) push();
}
function pull() {
  const x = aheadBehind(S.HEAD);
  if (!x) return toast(`<b>${esc(S.HEAD)}</b> has no upstream. Push it first to create one.`, 'warn');
  if (!x.behind) return toast('Already up to date');
  if (!x.ahead) {
    S.heads[S.HEAD] = S.remotes[x.up]; render();
    return toast(`Fast-forwarded <b>${esc(S.HEAD)}</b> by ${x.behind} commit${x.behind === 1 ? '' : 's'}`);
  }
  const c = newCommit(`Merge remote-tracking branch '${x.up}' into ${S.HEAD}`, [], [S.heads[S.HEAD], S.remotes[x.up]]);
  S.heads[S.HEAD] = c.sha; if (!dirty()) S.sel = c.sha; render();
  toast(`Branches diverged (↑${x.ahead} ↓${x.behind}), so Gitsprout made merge commit <b>${c.sha}</b>`);
}
function push() {
  const x = aheadBehind(S.HEAD);
  if (!x) {
    const up = 'origin/' + S.HEAD; S.remotes[up] = S.heads[S.HEAD]; S.upstream[S.HEAD] = up; render();
    return toast(`Published <b>${esc(S.HEAD)}</b> to ${esc(up)} and set it as upstream`);
  }
  if (x.behind) return toast(`Push rejected: ${esc(x.up)} has ${x.behind} commit${x.behind === 1 ? '' : 's'} you don't have. Pull first, then push.`, 'bad');
  if (!x.ahead) return toast('Everything up to date');
  S.remotes[x.up] = S.heads[S.HEAD]; render();
  toast(`Pushed ${x.ahead} commit${x.ahead === 1 ? '' : 's'} to <b>${esc(x.up)}</b>`);
}
function fetchAll() {
  if (!S.fetched) {
    S.fetched = true;
    const c = newCommit('AutoBuild', VER, [S.remotes['origin/develop']]); c.author = 'ci-bot';
    S.remotes['origin/develop'] = c.sha; render();
    return toast('Fetched origin · 1 new commit on origin/develop');
  }
  toast('Fetched origin · nothing new');
}
function stash() {
  if (!dirty()) return toast('Nothing to stash', 'warn');
  const files = [...S.wip.staged, ...S.wip.unstaged];
  const c = MAP[headSha()];
  S.stashes.unshift({ msg: `WIP on ${S.HEAD}: ${c.sha} ${c.msg.slice(0, 40)}`, files });
  S.wip = { unstaged: [], staged: [] }; S.diff = null; render();
  toast(`Stashed ${files.length} file${files.length === 1 ? '' : 's'} as stash@{0}`);
}
function applyStash(i, drop) {
  const st = S.stashes[i]; if (!st) return toast('No stash to pop', 'warn');
  st.files.forEach(f => { if (!S.wip.unstaged.some(x => x.path === f.path) && !S.wip.staged.some(x => x.path === f.path)) S.wip.unstaged.push({ ...f, diff: f.diff || fakeDiff(f.path, 4, 2, 'stash') }); });
  if (drop) S.stashes.splice(i, 1);
  S.sel = 'WIP'; S.diff = null; render();
  toast(`${drop ? 'Popped' : 'Applied'} stash@{${i}} · ${st.files.length} file${st.files.length === 1 ? '' : 's'} back in the working tree`);
}
function move(path, from, to) {
  const i = S.wip[from].findIndex(f => f.path === path); if (i < 0) return;
  const [f] = S.wip[from].splice(i, 1); S.wip[to].push(f);
  if (S.diff && S.diff.path === path) S.diff.kind = to;
  render();
}
function createBranchModal(at) {
  const from = at || headSha();
  openModal({
    title: 'Create branch', ok: 'Create',
    body: `<p>From <span class="mono">${from}</span> ${esc(MAP[from].msg.slice(0, 48))}</p>
      <div class="field" style="margin-top:10px"><input id="m-name" placeholder="GARM-901-widget-retry" autocomplete="off" aria-label="Branch name"></div>
      <label class="check" style="margin-top:10px"><input type="checkbox" id="m-co" checked> Check out after creating</label>`,
    onOk: () => {
      const n = $('#m-name').value.trim(); const e = branchNameError(n); if (e) return e;
      S.heads[n] = from;
      if ($('#m-co').checked) { S.HEAD = n; S.sel = dirty() ? 'WIP' : from; }
      render(); toast(`Created branch <b>${esc(n)}</b>${S.HEAD === n ? ' and switched to it' : ''}`);
    },
  });
}

/* ---------- context menu ---------- */
function showMenu(ev, items) {
  const m = $('#ctx');
  m.innerHTML = items.map(it => it === '-' ? '<hr>' :
    `<button role="menuitem" class="${it.danger ? 'danger' : ''}" ${it.disabled ? 'disabled' : `data-act="${it.act}" data-arg="${esc(it.arg ?? '')}"`}>${esc(it.label)}${it.later ? '<span class="later">later</span>' : ''}</button>`).join('');
  m.hidden = false;
  const r = m.getBoundingClientRect();
  m.style.left = Math.max(8, Math.min(ev.clientX, innerWidth - r.width - 8)) + 'px';
  m.style.top = Math.max(8, Math.min(ev.clientY, innerHeight - r.height - 8)) + 'px';
  m.querySelector('button:not(:disabled)')?.focus();
}
const hideMenu = () => { $('#ctx').hidden = true; };
function menuFor(kind, arg) {
  if (kind === 'local') {
    const isHead = arg === S.HEAD;
    return [
      { label: isHead ? 'Checked out' : `Check out ${arg}`, act: 'checkout', arg, disabled: isHead },
      { label: 'Pull (fast-forward if possible)', act: 'pull', disabled: !isHead },
      { label: 'Push', act: 'push', disabled: !isHead },
      '-',
      { label: 'Create branch here…', act: 'branch-here', arg: S.heads[arg] },
      { label: `Rename ${arg}…`, act: 'rename', arg },
      { label: `Delete ${arg}…`, act: 'delete', arg, danger: true, disabled: isHead },
      '-',
      { label: 'Copy branch name', act: 'copy', arg },
    ];
  }
  if (kind === 'remote') return [
    { label: 'Check out as local branch', act: 'checkout-remote', arg },
    { label: 'Create branch here…', act: 'branch-here', arg: S.remotes[arg] },
    '-', { label: 'Copy branch name', act: 'copy', arg },
  ];
  if (kind === 'stash') return [
    { label: 'Apply stash', act: 'stash-apply', arg }, { label: 'Pop stash', act: 'stash-pop', arg },
    { label: 'Drop stash…', act: 'stash-drop', arg, danger: true },
  ];
  if (kind === 'commit') return [
    { label: 'Create branch here…', act: 'branch-here', arg },
    { label: 'Reset branch to this commit', later: true, disabled: true },
    { label: 'Revert commit', later: true, disabled: true },
    { label: 'Cherry-pick commit', later: true, disabled: true },
    '-',
    { label: 'Copy commit SHA', act: 'copy', arg },
    { label: 'Copy commit message', act: 'copy-msg', arg },
  ];
  return [];
}

/* ---------- actions ---------- */
function copy(text, label) {
  const done = () => toast(`Copied ${label || ''} <span class="mono">${esc(text)}</span>`);
  try { navigator.clipboard.writeText(text).then(done, () => toast('Clipboard blocked here. Select the text instead.', 'warn')); }
  catch { toast('Clipboard blocked here. Select the text instead.', 'warn'); }
}
function act(name, arg, el) {
  hideMenu();
  switch (name) {
    case 'sel-ref': return select(S.heads[arg], true);
    case 'sel-remote': return select(S.remotes[arg], true);
    case 'sel-tag': return select(S.tags[arg], true);
    case 'sel-commit': return select(arg, true);
    case 'sel-stash': S.sel = 'stash:' + arg; S.diff = null; return render();
    case 'checkout': return checkout(arg);
    case 'checkout-remote': return checkoutRemote(arg);
    case 'fetch': return fetchAll();
    case 'pull': return pull();
    case 'push': return push();
    case 'stash': return stash();
    case 'pop': return applyStash(0, true);
    case 'stash-apply': return applyStash(+arg, false);
    case 'stash-pop': return applyStash(+arg, true);
    case 'stash-drop': return openModal({
      title: `Drop stash@{${arg}}?`, ok: 'Drop stash', danger: true,
      body: `<p>${esc(S.stashes[+arg].msg)}</p><p style="margin-top:8px">The changes are gone after this. Git keeps the object until the next gc, but Gitsprout won't show it again.</p>`,
      onOk: () => { S.stashes.splice(+arg, 1); if (S.sel.startsWith('stash:')) S.sel = headSha(); render(); toast(`Dropped stash@{${arg}}`); },
    });
    case 'new-branch': return createBranchModal();
    case 'branch-here': return createBranchModal(arg);
    case 'rename': return openModal({
      title: `Rename ${arg}`, ok: 'Rename',
      body: `<div class="field"><input id="m-name" value="${esc(arg)}" autocomplete="off" aria-label="New name"></div>`,
      onOk: () => {
        const n = $('#m-name').value.trim(); const e = branchNameError(n, arg); if (e) return e;
        if (n === arg) return;
        S.heads[n] = S.heads[arg]; delete S.heads[arg];
        if (S.upstream[arg]) { S.upstream[n] = S.upstream[arg]; delete S.upstream[arg]; }
        if (S.HEAD === arg) S.HEAD = n;
        render(); toast(`Renamed <b>${esc(arg)}</b> to <b>${esc(n)}</b>`);
      },
    });
    case 'delete': {
      const x = aheadBehind(arg); const unpushed = !x || x.ahead > 0;
      return openModal({
        title: `Delete ${arg}?`, ok: 'Delete branch', danger: true,
        body: `<p>Deletes the local branch only. ${x ? `${esc(x.up)} stays on the server.` : ''}</p>${unpushed ? `<p style="margin-top:8px;color:var(--warn)">${x ? `${x.ahead} commit${x.ahead === 1 ? ' is' : 's are'} not pushed` : 'This branch was never pushed'}, so those commits will only be reachable through reflog.</p>` : ''}`,
        onOk: () => { delete S.heads[arg]; delete S.upstream[arg]; render(); toast(`Deleted branch <b>${esc(arg)}</b>`); },
      });
    }
    case 'copy': return copy(arg);
    case 'copy-msg': return copy(MAP[arg].msg, 'message');
    case 'stage': return move(arg, 'unstaged', 'staged');
    case 'unstage': return move(arg, 'staged', 'unstaged');
    case 'stage-all': S.wip.staged.push(...S.wip.unstaged); S.wip.unstaged = []; if (S.diff && S.diff.kind === 'unstaged') S.diff.kind = 'staged'; return render();
    case 'unstage-all': S.wip.unstaged.push(...S.wip.staged); S.wip.staged = []; if (S.diff && S.diff.kind === 'staged') S.diff.kind = 'unstaged'; return render();
    case 'open-file': {
      const kind = el.dataset.kind;
      S.diff = kind === 'commit' ? { kind, path: arg, sha: S.sel } : kind === 'stash' ? { kind, path: arg, stash: +el.dataset.stash } : { kind, path: arg };
      renderPanel(); return renderDiff();
    }
    case 'close-diff': S.diff = null; renderPanel(); return renderDiff();
    case 'commit-push': return doCommit(true);
    case 'toggle-ci': S.hideCI = !S.hideCI; return renderGraph();
    case 'toggle-side': return $('#app').classList.toggle('side-open');
    case 'focus-filter': $('#app').classList.add('side-open'); return $('#sideq')?.focus();
    case 'tab': if (arg !== 'Pilot7') toast(`The prototype has one repo loaded. In the app, <b>${esc(arg)}</b> opens in its own tab with its own state.`, 'warn'); return;
    case 'add-repo': return toast('In the app this opens a folder picker and remembers the repo as a tab.', 'warn');
    case 'm-cancel': return closeModal();
  }
}

document.addEventListener('click', e => {
  if (!e.target.closest('#ctx')) hideMenu();
  const row = e.target.closest('[data-row]');
  const el = e.target.closest('[data-act]');
  if (el && !(el.tagName === 'A')) { e.preventDefault(); act(el.dataset.act, el.dataset.arg, el); return; }
  if (row && !e.target.closest('a')) select(row.dataset.row);
});
document.addEventListener('dblclick', e => {
  const el = e.target.closest('[data-dbl]');
  if (el) act(el.dataset.dbl, el.dataset.arg, el);
});
document.addEventListener('contextmenu', e => {
  const el = e.target.closest('[data-ctx]');
  if (!el) return hideMenu();
  e.preventDefault();
  if (el.dataset.row) { S.sel = el.dataset.row; S.diff = null; render(); }
  showMenu(e, menuFor(el.dataset.ctx, el.dataset.arg));
});
document.addEventListener('input', e => {
  const t = e.target;
  if (t.id === 'q') { S.q = t.value; renderGraph(); }
  else if (t.id === 'sideq') {
    S.sideQ = t.value; const pos = t.selectionStart; renderSide();
    const n = $('#sideq'); n.focus(); n.setSelectionRange(pos, pos);
  } else if (t.id === 'summary') {
    S.draft.summary = t.value; const left = 72 - t.value.length;
    const l = $('#left'); l.textContent = left; l.classList.toggle('over', left < 0); syncCommitButtons();
  } else if (t.id === 'desc') S.draft.desc = t.value;
});
document.addEventListener('change', e => {
  if (e.target.id === 'amend') {
    S.draft.amend = e.target.checked;
    if (S.draft.amend && !S.draft.summary) { S.draft.summary = MAP[headSha()].msg; $('#summary').value = S.draft.summary; $('#left').textContent = 72 - S.draft.summary.length; }
    syncCommitButtons();
  }
});
document.addEventListener('submit', e => {
  e.preventDefault();
  if (e.target.id === 'commitform') return doCommit(false);
  if (e.target.id === 'modal' && modalOk) {
    const err = modalOk();
    if (typeof err === 'string' && err) { $('#m-err').textContent = err; return; }
    closeModal();
  }
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') {
    if (!$('#scrim').hidden) return closeModal();
    if (!$('#ctx').hidden) return hideMenu();
    if (S.diff) { S.diff = null; renderPanel(); return renderDiff(); }
  }
  if ((e.metaKey || e.ctrlKey) && e.key === 'Enter' && e.target.closest('#commitform')) { e.preventDefault(); if (!$('#do-commit').disabled) doCommit(false); return; }
  if ((e.metaKey || e.ctrlKey) && e.altKey && (e.key === 'f' || e.code === 'KeyF')) { e.preventDefault(); return act('focus-filter'); }
  if (e.key === 'Enter' && e.target.matches('.ref[data-act]')) { e.preventDefault(); act(e.target.dataset.act, e.target.dataset.arg, e.target); return; }
  const typing = e.target.closest('input, textarea, [contenteditable]');
  if (typing || !$('#scrim').hidden) return;
  if (['ArrowDown', 'ArrowUp', 'j', 'k'].includes(e.key)) {
    const ids = [...document.querySelectorAll('#graph [data-row]')].map(r => r.dataset.row);
    let i = ids.indexOf(S.sel); i += (e.key === 'ArrowDown' || e.key === 'j') ? 1 : -1;
    if (i >= 0 && i < ids.length) { e.preventDefault(); select(ids[i], true); }
  }
});

render();
</script>
