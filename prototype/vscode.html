<title>Gitsprout for VS Code</title>
<style>
/* Layout: a faithful VS Code window (Dark/Light Modern) — activity bar | Gitsprout tree view | editor tabs (graph webview, native diff) | status bar; API labels mark what is native vs ours */
:root {
  --page: #0b0b0c;
  --title: #181818; --act: #181818; --side: #181818; --editor: #1f1f1f; --tab: #181818; --tab-on: #1f1f1f;
  --line: #2b2b2b; --fg: #cccccc; --fg-strong: #ffffff; --muted: #9d9d9d; --faint: #6e7681;
  --accent: #0078d4; --accent-fg: #ffffff; --accent-hover: #026ec1;
  --hover: #2a2d2e; --sel: #04395e; --sel-dim: #37373d;
  --input: #313131; --input-line: #3c3c3c; --menu: #1f1f1f; --menu-line: #454545;
  --ins: rgba(156, 204, 44, .2); --rem: rgba(255, 0, 0, .2); --hatch: rgba(204, 204, 204, .07);
  --mod: #e2c08d; --untracked: #73c991; --added: #81b88b; --deleted: #c74e39;
  --warn: #cca700; --err: #f85149; --info: #3794ff;
  --api: #c586c0; --api-bg: rgba(197, 134, 192, .14);
  --g0: #ffb000; --g1: #dc267f; --g2: #40b0a6; --g3: #b66dff; --g4: #994f00; --g5: #3794ff;
  --ui: -apple-system, BlinkMacSystemFont, 'Segoe WPC', 'Segoe UI', system-ui, Ubuntu, sans-serif;
  --mono: Menlo, Monaco, 'SF Mono', Consolas, 'Courier New', monospace;
  color-scheme: dark;
}
@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) {
    --page: #e6e6e9;
    --title: #f8f8f8; --act: #f8f8f8; --side: #f8f8f8; --editor: #ffffff; --tab: #f8f8f8; --tab-on: #ffffff;
    --line: #e5e5e5; --fg: #3b3b3b; --fg-strong: #000000; --muted: #6f6f6f; --faint: #8b949e;
    --accent: #005fb8; --accent-fg: #ffffff; --accent-hover: #0258a8;
    --hover: #f2f2f2; --sel: #e4e6f1; --sel-dim: #e4e6f1;
    --input: #ffffff; --input-line: #cecece; --menu: #ffffff; --menu-line: #cecece;
    --ins: rgba(155, 185, 85, .25); --rem: rgba(255, 0, 0, .14); --hatch: rgba(34, 34, 34, .06);
    --mod: #895503; --untracked: #007100; --added: #587c0c; --deleted: #ad0707;
    --warn: #bf8803; --err: #e51400; --info: #1a85ff;
    --api: #9a3e93; --api-bg: rgba(154, 62, 147, .1);
    --g0: #c98a00; --g1: #dc267f; --g2: #2a9187; --g3: #9a4fe0; --g4: #994f00; --g5: #005fb8;
    color-scheme: light;
  }
}
:root[data-theme="light"] {
  --page: #e6e6e9;
  --title: #f8f8f8; --act: #f8f8f8; --side: #f8f8f8; --editor: #ffffff; --tab: #f8f8f8; --tab-on: #ffffff;
  --line: #e5e5e5; --fg: #3b3b3b; --fg-strong: #000000; --muted: #6f6f6f; --faint: #8b949e;
  --accent: #005fb8; --accent-fg: #ffffff; --accent-hover: #0258a8;
  --hover: #f2f2f2; --sel: #e4e6f1; --sel-dim: #e4e6f1;
  --input: #ffffff; --input-line: #cecece; --menu: #ffffff; --menu-line: #cecece;
  --ins: rgba(155, 185, 85, .25); --rem: rgba(255, 0, 0, .14); --hatch: rgba(34, 34, 34, .06);
  --mod: #895503; --untracked: #007100; --added: #587c0c; --deleted: #ad0707;
  --warn: #bf8803; --err: #e51400; --info: #1a85ff;
  --api: #9a3e93; --api-bg: rgba(154, 62, 147, .1);
  --g0: #c98a00; --g1: #dc267f; --g2: #2a9187; --g3: #9a4fe0; --g4: #994f00; --g5: #005fb8;
  color-scheme: light;
}

* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--page); color: var(--fg); font: 13px/1.4 var(--ui); padding-inline: 16px; padding-block: 12px 16px; display: flex; flex-direction: column; gap: 10px; -webkit-font-smoothing: antialiased; }
button, input, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 1px solid var(--accent); outline-offset: -1px; }
svg { flex: none; display: block; }

/* page header outside the fake window */
.pagehead { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.pagehead h1 { margin: 0; font-size: 14px; font-weight: 600; display: flex; align-items: center; gap: 8px; }
.pagehead h1 svg { color: #3fa34d; }
.pagehead .sub { color: var(--muted); font-size: 12px; }
.switch { margin-left: auto; display: flex; align-items: center; gap: 8px; border: 0; background: none; color: var(--muted); font-size: 12px; padding: 4px; }
.switch i { width: 30px; height: 16px; border-radius: 8px; background: var(--input-line); position: relative; transition: background .15s; }
.switch i::after { content: ''; position: absolute; top: 2px; left: 2px; width: 12px; height: 12px; border-radius: 50%; background: var(--fg-strong); transition: transform .15s; }
.switch[aria-pressed="true"] i { background: var(--api); }
.switch[aria-pressed="true"] i::after { transform: translateX(14px); }

/* window */
.vsc { position: relative; flex: 1; min-height: 560px; display: grid; grid-template-rows: 35px minmax(0, 1fr) 22px; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; background: var(--editor); box-shadow: 0 18px 50px rgba(0, 0, 0, .28); }
.titlebar { display: grid; grid-template-columns: 1fr minmax(0, 520px) 1fr; align-items: center; background: var(--title); border-bottom: 1px solid var(--line); padding: 0 10px; gap: 10px; }
.lights { display: flex; gap: 8px; }
.lights i { width: 12px; height: 12px; border-radius: 50%; background: #ff5f57; } .lights i:nth-child(2) { background: #febc2e; } .lights i:nth-child(3) { background: #28c840; }
.cc { display: flex; align-items: center; justify-content: center; gap: 6px; height: 24px; border: 1px solid var(--input-line); background: var(--hover); border-radius: 6px; color: var(--muted); font-size: 12px; min-width: 0; white-space: nowrap; overflow: hidden; }
.cc:hover { border-color: var(--faint); color: var(--fg); }
.tright { display: flex; justify-content: flex-end; gap: 6px; color: var(--muted); }
.body { display: grid; grid-template-columns: 48px auto minmax(0, 1fr); min-height: 0; }

.activity { background: var(--act); border-right: 1px solid var(--line); display: flex; flex-direction: column; align-items: center; padding-top: 4px; position: relative; }
.ab { position: relative; width: 48px; height: 48px; display: grid; place-items: center; border: 0; background: none; color: var(--faint); }
.ab:hover { color: var(--fg); }
.ab.on { color: var(--fg-strong); box-shadow: inset 2px 0 0 var(--accent); }
.ab .bdg { position: absolute; right: 7px; bottom: 9px; min-width: 16px; height: 16px; padding: 0 4px; border-radius: 8px; background: var(--accent); color: var(--accent-fg); font-size: 9px; font-weight: 600; display: grid; place-items: center; }
.ab.sprout svg { color: inherit; }
.activity .grow { flex: 1; }

.side { width: 290px; background: var(--side); border-right: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; position: relative; }
.side[hidden] { display: none; }
.vt { display: flex; align-items: center; height: 35px; padding: 0 8px 0 20px; font-size: 11px; letter-spacing: .02em; color: var(--fg); flex: none; }
.vt .va { margin-left: auto; display: flex; gap: 2px; }
.ib { width: 22px; height: 22px; border: 0; border-radius: 5px; background: none; color: var(--fg); display: grid; place-items: center; padding: 0; }
.ib:hover { background: var(--hover); }
.ib:disabled { opacity: .35; cursor: default; background: none; }
.sbody { overflow: auto; min-height: 0; flex: 1; }
.pane { border-top: 1px solid var(--line); }
.pane:first-child { border-top: 0; }
.ph { display: flex; align-items: center; gap: 2px; height: 22px; padding: 0 8px 0 2px; font-size: 11px; font-weight: 700; letter-spacing: .02em; cursor: pointer; user-select: none; }
.ph .pc { margin-left: 6px; font-weight: 400; color: var(--muted); font-variant-numeric: tabular-nums; }
.ph .pa { margin-left: auto; display: none; gap: 2px; }
.ph:hover .pa, .ph:focus-within .pa { display: flex; }
.tr { display: flex; align-items: center; height: 22px; padding-left: calc(var(--d, 0) * 8px + 8px); padding-right: 6px; cursor: pointer; user-select: none; white-space: nowrap; }
.tr:hover { background: var(--hover); }
.tr.on { background: var(--sel); color: var(--fg-strong); }
.tr .tw { width: 16px; display: grid; place-items: center; color: var(--fg); }
.tr .ti { width: 20px; display: grid; place-items: center; color: var(--fg); margin-right: 4px; }
.tr .ti.head { color: var(--accent); }
.tr .tl { overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.tr .tl b { font-weight: 600; }
.tr .td { margin-left: 8px; color: var(--muted); font-size: 12px; overflow: hidden; text-overflow: ellipsis; min-width: 0; flex: 1; font-variant-numeric: tabular-nums; }
.tr .td .dn { color: var(--warn); } .tr .td .up { color: var(--untracked); }
.tr .ta { display: none; gap: 1px; margin-left: 4px; }
.tr:hover .ta, .tr.on .ta { display: flex; }
.tr .ta .ib { width: 20px; height: 20px; }
.tr .letter { width: 16px; text-align: center; font-size: 12px; font-weight: 600; margin-left: 6px; }
.L-M { color: var(--mod); } .L-U, .L-A { color: var(--untracked); } .L-D { color: var(--deleted); }
.empty { padding: 4px 20px 8px 30px; color: var(--muted); font-size: 12px; }

/* built-in SCM emulation */
.scm { padding: 6px 12px 8px 20px; display: flex; flex-direction: column; gap: 6px; }
.scm textarea { width: 100%; min-height: 54px; resize: vertical; background: var(--input); border: 1px solid var(--input-line); border-radius: 2px; padding: 5px 6px; outline: none; font-size: 13px; }
.scm textarea:focus { border-color: var(--accent); }
.scm textarea.bad { border-color: var(--err); }
.scm .verr { color: var(--err); font-size: 12px; }
.vbtns { display: flex; }
.vbtn { flex: 1; display: flex; align-items: center; justify-content: center; gap: 6px; height: 26px; border: 0; border-radius: 2px; background: var(--accent); color: var(--accent-fg); font-size: 13px; }
.vbtn:hover { background: var(--accent-hover); }
.vbtn.dd { flex: none; width: 26px; border-left: 1px solid rgba(255, 255, 255, .35); }
.vbtns .vbtn:first-child:not(:only-child) { border-radius: 2px 0 0 2px; } .vbtn.dd { border-radius: 0 2px 2px 0; }
.vbtn.sec { background: var(--input); color: var(--fg); border: 1px solid var(--input-line); }
.vbtn.sec:hover { background: var(--hover); }

/* editor */
.editor { display: flex; flex-direction: column; min-width: 0; min-height: 0; background: var(--editor); position: relative; }
.tabs { display: flex; background: var(--tab); border-bottom: 1px solid var(--line); height: 35px; flex: none; overflow-x: auto; scrollbar-width: none; }
.tab { display: flex; align-items: center; gap: 6px; padding: 0 6px 0 12px; border-right: 1px solid var(--line); color: var(--muted); cursor: pointer; white-space: nowrap; min-width: 0; position: relative; }
.tab.on { background: var(--tab-on); color: var(--fg-strong); box-shadow: inset 0 1px 0 var(--accent); }
.tab.on::after { content: ''; position: absolute; left: 0; right: 0; bottom: -1px; height: 1px; background: var(--tab-on); }
.tab .tx { width: 20px; height: 20px; border: 0; background: none; border-radius: 4px; display: grid; place-items: center; color: inherit; visibility: hidden; padding: 0; }
.tab.on .tx, .tab:hover .tx { visibility: visible; }
.tab .tx:hover { background: var(--hover); }
.tab .ticon { color: var(--info); } .tab .ticon.g { color: #3fa34d; }
.tab i { font-style: normal; color: var(--muted); }
.tabbody { flex: 1; min-height: 0; display: flex; flex-direction: column; position: relative; }

.watermark { flex: 1; display: grid; place-items: center; color: var(--muted); }
.watermark dl { display: grid; grid-template-columns: auto auto; gap: 8px 14px; margin: 0; font-size: 12.5px; }
.watermark dt { text-align: right; } .watermark dd { margin: 0; }
kbd { font: 11px var(--ui); background: var(--hover); border: 1px solid var(--input-line); border-bottom-width: 2px; border-radius: 3px; padding: 0 4px; color: var(--fg); }

/* webview: graph */
.wv { flex: 1; min-height: 0; display: flex; flex-direction: column; container-type: inline-size; position: relative; }
.wvbar { display: flex; align-items: center; gap: 8px; padding: 6px 12px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.vin { height: 24px; background: var(--input); border: 1px solid var(--input-line); border-radius: 2px; padding: 0 6px; outline: none; width: 240px; max-width: 100%; }
.vin:focus { border-color: var(--accent); }
.vchip { height: 22px; display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--input-line); border-radius: 11px; background: none; padding: 0 9px; font-size: 12px; color: var(--muted); }
.vchip:hover { color: var(--fg); }
.vchip[aria-pressed="true"] { border-color: var(--accent); color: var(--fg-strong); background: color-mix(in srgb, var(--accent) 22%, transparent); }
.wvbar .cnt { margin-left: auto; color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }
.split { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(0, 1fr) 340px; }
.glist { overflow: auto; min-height: 0; padding-bottom: 10px; }
.gcols, .gr { display: grid; grid-template-columns: var(--gw) minmax(0, 1fr) 56px 120px 64px; column-gap: 10px; align-items: center; padding: 0 12px; }
.gcols { height: 24px; font-size: 11px; color: var(--muted); border-bottom: 1px solid var(--line); position: sticky; top: 0; background: var(--editor); z-index: 1; }
.gr { height: 26px; cursor: pointer; user-select: none; }
.gr:hover { background: var(--hover); }
.gr.on { background: var(--sel); color: var(--fg-strong); }
.gr.dim { opacity: .3; }
.gdesc { display: flex; align-items: center; gap: 5px; min-width: 0; white-space: nowrap; }
.gdesc .t { overflow: hidden; text-overflow: ellipsis; }
.gdesc.merge .t, .gdesc.ci .t { color: var(--muted); }
.gdesc .wip { font-style: italic; color: var(--fg-strong); }
.ref { display: inline-flex; align-items: center; gap: 3px; flex: none; height: 18px; padding: 0 6px; border-radius: 9px; font-size: 11px; border: 1px solid var(--c); color: var(--fg); background: color-mix(in srgb, var(--c) 18%, transparent); }
.ref.head { background: var(--c); color: #111; font-weight: 600; }
.ref.tag { border-style: dashed; }
.jira { flex: none; font: 11px var(--mono); padding: 0 5px; border-radius: 3px; border: 1px solid var(--input-line); color: var(--fg); text-decoration: none; }
a.jira { color: var(--info); }
a.jira:hover { text-decoration: underline; }
.kind { flex: none; font-size: 9.5px; font-weight: 700; letter-spacing: .06em; color: var(--muted); }
.kind.FIX { color: var(--err); } .kind.FEAT, .kind.FEATURE { color: var(--untracked); } .kind.DOCS { color: var(--info); } .kind.UPDATE { color: var(--warn); }
.gwhen, .gwho, .gsha { color: var(--muted); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-variant-numeric: tabular-nums; }
.gsha { font-family: var(--mono); font-size: 11.5px; }
.gr.on .gwhen, .gr.on .gwho, .gr.on .gsha { color: var(--fg); }

.details { border-left: 1px solid var(--line); overflow: auto; min-height: 0; background: var(--editor); }
.dh { padding: 12px 14px 8px; display: flex; flex-direction: column; gap: 6px; }
.dh .row1 { display: flex; align-items: center; gap: 6px; color: var(--muted); font-size: 12px; }
.dh .row1 .sha { font-family: var(--mono); color: var(--fg); }
.dh h2 { margin: 0; font-size: 14px; font-weight: 600; line-height: 1.35; display: flex; flex-wrap: wrap; gap: 6px; align-items: baseline; text-wrap: balance; color: var(--fg-strong); }
.dh .body { color: var(--muted); white-space: pre-wrap; font-size: 12.5px; }
.dmeta { display: grid; grid-template-columns: 70px minmax(0, 1fr); gap: 5px 10px; padding: 4px 14px 12px; font-size: 12.5px; border-bottom: 1px solid var(--line); }
.dmeta dt { color: var(--muted); } .dmeta dd { margin: 0; display: flex; flex-wrap: wrap; gap: 5px; align-items: center; min-width: 0; }
.lnk { border: 0; background: none; padding: 0; color: var(--info); font: 12px var(--mono); }
.lnk:hover { text-decoration: underline; }
.dsec { padding: 8px 0; }
.dsec-h { display: flex; align-items: center; gap: 6px; padding: 0 14px 4px; font-size: 11px; font-weight: 700; letter-spacing: .02em; }
.dsec-h .n { color: var(--muted); font-weight: 400; margin-left: auto; font-variant-numeric: tabular-nums; }
.dsec .tr { padding-left: 14px; }
.ns { font: 11px var(--mono); color: var(--muted); margin-left: auto; padding-left: 8px; }
.ns .p { color: var(--untracked); } .ns .m { color: var(--deleted); }
.note { padding: 2px 14px 6px; color: var(--muted); font-size: 12.5px; }
.note .vbtn { margin-top: 8px; width: auto; display: inline-flex; padding: 0 12px; }
.nodetail { padding: 24px 16px; color: var(--muted); text-align: center; }

@container (max-width: 820px) {
  .split { grid-template-columns: minmax(0, 1fr); grid-template-rows: minmax(0, 1fr) minmax(0, 42%); }
  .details { border-left: 0; border-top: 1px solid var(--line); }
  .gcols, .gr { grid-template-columns: var(--gw) minmax(0, 1fr) 56px 64px; }
  .gwho { display: none; }
}
@container (max-width: 480px) {
  .gcols, .gr { grid-template-columns: var(--gw) minmax(0, 1fr); }
  .gwhen, .gsha { display: none; }
}

/* native diff editor emulation */
.ed { flex: 1; min-height: 0; display: flex; flex-direction: column; position: relative; }
.edbar { display: flex; align-items: center; gap: 4px; height: 22px; padding: 0 8px 0 14px; color: var(--muted); font-size: 12px; flex: none; }
.edbar .crumbs { display: flex; gap: 4px; align-items: center; min-width: 0; overflow: hidden; white-space: nowrap; }
.edbar .acts { margin-left: auto; display: flex; gap: 2px; }
.diff { flex: 1; min-height: 0; overflow: auto; font: 12px/18px var(--mono); }
.sbs { display: grid; grid-template-columns: 46px minmax(0, 1fr) 46px minmax(0, 1fr); }
.sbs > span { white-space: pre-wrap; word-break: break-all; min-height: 18px; }
.n { color: var(--faint); text-align: right; padding-right: 12px; user-select: none; font-variant-numeric: tabular-nums; }
.c { padding-right: 10px; }
.c.del { background: var(--rem); } .c.add { background: var(--ins); }
.n.del { background: var(--rem); } .n.add { background: var(--ins); }
.c.fill, .n.fill { background: repeating-linear-gradient(-45deg, var(--hatch) 0 2px, transparent 2px 7px); }
.c:nth-child(4n+2) { border-right: 1px solid var(--line); }
.fold { grid-column: 1 / -1; color: var(--muted); background: color-mix(in srgb, var(--info) 8%, transparent); padding: 1px 14px; font-family: var(--ui); font-size: 11.5px; }
.inl { display: grid; grid-template-columns: 46px 46px 18px minmax(0, 1fr); }
.inl > span { white-space: pre-wrap; word-break: break-all; min-height: 18px; }
.inl .sg { color: var(--faint); user-select: none; }
.inl .add { background: var(--ins); } .inl .del { background: var(--rem); }
.binary { padding: 30px 20px; color: var(--muted); font-family: var(--ui); max-width: 520px; }

/* status bar */
.status { display: flex; align-items: stretch; background: var(--title); border-top: 1px solid var(--line); font-size: 12px; color: var(--fg); min-width: 0; white-space: nowrap; }
.sb { display: flex; align-items: center; gap: 4px; padding: 0 7px; border: 0; background: none; color: inherit; font-size: 12px; position: relative; }
button.sb:hover { background: var(--hover); }
.sb.remote { background: var(--accent); color: var(--accent-fg); padding: 0 10px; }
.status .grow { flex: 1; }

/* quick pick, input box, dialog, menu, notifications */
.qp { position: absolute; top: 40px; left: 50%; transform: translateX(-50%); width: min(600px, calc(100% - 24px)); z-index: 40; background: var(--menu); border: 1px solid var(--menu-line); border-radius: 8px; box-shadow: 0 8px 24px rgba(0, 0, 0, .36); padding: 6px; display: flex; flex-direction: column; gap: 4px; }
.qp input { height: 26px; background: var(--input); border: 1px solid var(--accent); border-radius: 3px; padding: 0 6px; outline: none; width: 100%; }
.qp .prompt { font-size: 12px; color: var(--muted); padding: 2px 4px; }
.qp .verr { font-size: 12px; color: var(--fg); background: color-mix(in srgb, var(--err) 25%, transparent); border: 1px solid var(--err); padding: 3px 6px; border-radius: 2px; }
.qpl { max-height: 330px; overflow: auto; }
.qi { display: flex; align-items: center; gap: 8px; height: 24px; padding: 0 8px; border-radius: 3px; cursor: pointer; white-space: nowrap; }
.qi.on { background: var(--sel); color: var(--fg-strong); outline: 1px solid var(--accent); outline-offset: -1px; }
.qi .d { color: var(--muted); font-size: 12px; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.qi .kb { margin-left: auto; color: var(--muted); font-size: 11px; }
.qsep { display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: 11px; padding: 6px 8px 2px; }
.qsep::after { content: ''; flex: 1; border-top: 1px solid var(--line); }
.scrim { position: absolute; inset: 0; z-index: 45; background: rgba(0, 0, 0, .35); display: grid; place-items: center; padding: 16px; }

  { label: 'Gitsprout: Show Graph', kb: '⌥⌘G', run: showGraph },
  { label: 'Gitsprout: Fetch', run: () => withProgress('Fetching from origin…', doFetch) },
  { label: 'Gitsprout: Pull', run: () => withProgress(`Pulling from ${S.upstream[S.HEAD] || 'origin'}…`, doPull) },
  { label: 'Gitsprout: Push', run: () => withProgress(`Pushing to ${S.upstream[S.HEAD] || 'origin'}…`, doPush) },
  { label: 'Gitsprout: Checkout to…', run: () => act('qp-checkout') },
  { label: 'Gitsprout: Create Branch…', run: () => act('qp-create') },
  { label: 'Gitsprout: Stash…', run: () => act('qp-stash') },
  { label: 'Gitsprout: Pop Latest Stash', run: () => stashApply(0, true) },
  { label: 'Gitsprout: Toggle AutoBuild Commits', run: () => act('toggle-ci') },
  { label: 'View: Show Source Control', description: 'built-in', kb: '⌃⇧G', run: () => act('view', 'scm') },
];

/* ---------- actions ---------- */
function act(name, arg, el, ev) {
  hideMenu();
  switch (name) {
    case 'noop': return;
    case 'toggle-api': { const on = !$('#vsc').classList.contains('show-api'); $('#vsc').classList.toggle('show-api', on); $('#apiswitch').setAttribute('aria-pressed', on); return; }
    case 'view': S.view = el && el.closest('.activity') && S.view === arg ? null : arg; return render();
    case 'pane': S.closed[arg] = !S.closed[arg]; return render();
    case 'toggle': S.open[arg] = !S.open[arg]; S.treeSel = arg; return render();
    case 'tree-ref': {
      S.treeSel = arg;
      const [k, ...rest] = arg.split(':'); const n = rest.join(':');
      const sha = k === 'local' ? S.heads[n] : k === 'remote' ? S.remotes[n] : S.tags[n];
      return select(sha);
    }
    case 'select': return select(arg);
    case 'tab': S.active = arg; return render();
    case 'tab-close': S.tabs = S.tabs.filter(t => t.id !== arg); if (S.active === arg) S.active = S.tabs.length ? S.tabs[S.tabs.length - 1].id : null; return render();
    case 'show-graph': return showGraph();
    case 'open-diff': return openDiff(JSON.parse(arg));
    case 'diff-mode': S.diffMode = S.diffMode === 'split' ? 'inline' : 'split'; return render();
    case 'toggle-ci': S.hideCI = !S.hideCI; return render();
    case 'refresh': return notify('Refreshed.', { ttl: 1500 });
    case 'checkout': return checkout(arg);
    case 'checkout-remote': return checkoutRemote(arg);
    case 'fetch': return withProgress('Fetching from origin…', doFetch);
    case 'pull': return withProgress(`Pulling from ${S.upstream[S.HEAD] || 'origin'}…`, doPull);
    case 'push': return withProgress(`Pushing to ${S.upstream[S.HEAD] || 'origin'}…`, doPush);
    case 'sync': return withProgress('Synchronizing changes…', () => { const a = doPull(); if (a.kind) return a; const b = doPush(); return { text: `${a.text} ${b.text}`, kind: b.kind, actions: b.actions }; });
    case 'qp-checkout': return openQuickPick({
      placeholder: 'Select a ref to checkout',
      items: [{ label: '+ Create new branch…', value: { create: true } }, { sep: 'branches' },
        ...Object.keys(S.heads).map(n => ({ icon: I.branch, label: n, description: S.heads[n] + (n === S.HEAD ? ' · current' : ''), value: { local: n } })),
        { sep: 'remote branches' }, ...Object.keys(S.remotes).map(n => ({ icon: I.cloud, label: n, description: `Remote branch at ${S.remotes[n]}`, value: { remote: n } })),
        { sep: 'tags' }, ...Object.keys(S.tags).map(n => ({ icon: I.tag, label: n, description: `Tag at ${S.tags[n]}`, value: { tag: n } }))],
      onPick: it => it.value.create ? act('qp-create') : it.value.local ? checkout(it.value.local) : it.value.remote ? checkoutRemote(it.value.remote) : notify('Checking out a tag leaves you in detached HEAD. Not part of the prototype.', { kind: 'warn' }),
    });
    case 'qp-create': {
      const start = arg || headSha();
      return openInputBox({
        prompt: `Please provide a new branch name (from ${start}). Press 'Enter' to confirm or 'Escape' to cancel.`, placeholder: 'Branch name',
        validate: v => branchNameError(v), onAccept: v => { S.heads[v] = start; checkout(v); S.sel = dirty() ? 'WIP' : start; render(); },
      });
    }
    case 'qp-rename': return openInputBox({
      prompt: `Please provide a new name for '${arg}'.`, placeholder: 'Branch name', value: arg, validate: v => branchNameError(v, arg),
      onAccept: v => { if (v === arg) return; S.heads[v] = S.heads[arg]; delete S.heads[arg]; if (S.upstream[arg]) { S.upstream[v] = S.upstream[arg]; delete S.upstream[arg]; } if (S.HEAD === arg) S.HEAD = v; S.treeSel = 'local:' + v; render(); },
    });
    case 'delete': {
      const x = aheadBehind(arg);
      return openDialog({
        title: `Are you sure you want to delete the branch '${arg}'?`,
        detail: x ? (x.ahead ? `${x.ahead} commit${x.ahead === 1 ? ' is' : 's are'} not pushed to ${x.up}. They will only be reachable through the reflog.` : `${x.up} stays on the server.`) : 'This branch was never pushed. Its commits will only be reachable through the reflog.',
        buttons: [{ label: 'Delete Branch', primary: true, run: () => { delete S.heads[arg]; delete S.upstream[arg]; render(); } }],
      });
    }
    case 'qp-stash':
      if (!dirty()) return notify('There are no changes to stash.', { kind: 'info' });
      return openInputBox({ prompt: "Optionally provide a stash message. Press 'Enter' to confirm or 'Escape' to cancel.", placeholder: 'Stash message', onAccept: v => stashPush(v) });
    case 'stash-apply': return stashApply(+arg, false);
    case 'stash-pop': return stashApply(+arg, true);
    case 'stash-drop': return openDialog({ title: `Are you sure you want to drop stash@{${arg}}?`, detail: S.stashes[+arg]?.msg || '', buttons: [{ label: 'Drop Stash', primary: true, run: () => { S.stashes.splice(+arg, 1); S.open = Object.fromEntries(Object.entries(S.open).filter(([k]) => !k.startsWith('stash:'))); S.tabs = S.tabs.filter(t => t.src !== 'stash'); render(); } }] });
    case 'stage': return moveFile(arg, 'unstaged', 'staged');
    case 'unstage': return moveFile(arg, 'staged', 'unstaged');
    case 'stage-all': S.wip.staged.push(...S.wip.unstaged); S.wip.unstaged = []; S.tabs.forEach(t => { if (t.src === 'wt') { const nid = 'diff:idx::' + t.path; if (S.active === t.id) S.active = nid; t.id = nid; t.src = 'idx'; } }); return render();
    case 'unstage-all': S.wip.unstaged.push(...S.wip.staged); S.wip.staged = []; S.tabs.forEach(t => { if (t.src === 'idx') { const nid = 'diff:wt::' + t.path; if (S.active === t.id) S.active = nid; t.id = nid; t.src = 'wt'; } }); return render();
    case 'discard': return openDialog({ title: `Are you sure you want to discard changes in '${arg.split('/').pop()}'?`, detail: 'This action is irreversible. Your current working set will be forever lost if you proceed.', buttons: [{ label: 'Discard File', primary: true, run: () => { S.wip.unstaged = S.wip.unstaged.filter(f => f.path !== arg); render(); } }] });
    case 'discard-all': return openDialog({ title: `Are you sure you want to discard ALL changes in ${S.wip.unstaged.length} files?`, detail: 'This action is irreversible. Your current working set will be forever lost if you proceed.', buttons: [{ label: `Discard All ${S.wip.unstaged.length} Files`, primary: true, run: () => { S.wip.unstaged = []; render(); } }] });
    case 'scm-commit': return commit();
    case 'scm-commit-menu': { const r = el.getBoundingClientRect(); return showMenu(r.left, r.bottom + 2, [{ label: 'Commit', act: 'scm-commit' }, { label: 'Commit (Amend)', act: 'scm-amend' }, '-', { label: 'Commit & Push', act: 'scm-commit-push' }], 'built-in SCM menu'); }
    case 'scm-amend': if (!S.msg.trim()) S.msg = MAP[headSha()].msg; return commit({ amend: true });
    case 'scm-commit-push': return commit({ push: true });
    case 'menu-local': { const r = el.getBoundingClientRect(); return showMenu(r.left, r.bottom + 2, menuFor('local', arg), 'menus › view/item/context'); }
    case 'menu-view': { const r = el.getBoundingClientRect(); return showMenu(r.left - 180, r.bottom + 2, [{ label: 'Fetch', act: 'fetch' }, { label: 'Pull', act: 'pull' }, { label: 'Push', act: 'push' }, '-', { label: 'Create Branch…', act: 'qp-create' }, { label: 'Stash…', act: 'qp-stash' }, { label: 'Pop Latest Stash', act: 'stash-pop', arg: 0, disabled: !S.stashes.length }, '-', { label: S.hideCI ? 'Show AutoBuild Commits' : 'Hide AutoBuild Commits', act: 'toggle-ci' }], 'menus › view/title'); }
    case 'copy': return copy(arg, /^[0-9a-f]{7}$/.test(arg) ? 'SHA' : 'branch name');
    case 'copy-msg': return copy(MAP[arg].msg, 'message');
    case 'palette': return openQuickPick({ placeholder: 'Type the name of a command to run.', prefix: '>', items: COMMANDS().map(c => ({ ...c, icon: '' })), onPick: it => it.run() });
    case 'qp-pick': return qpAccept(+arg);
    case 'dlg': { const b = DLG && DLG[+arg]; closeDialog(); if (b) b.run(); return; }
    case 'note-close': return el.closest('.nt').remove();
    case 'note-action': { const n = el.closest('.nt'); const a = n._actions[+arg]; n.remove(); if (a) a.run(); return; }
  }
}

document.addEventListener('click', e => {
  if (!e.target.closest('#menu')) hideMenu();
  if (QP && !e.target.closest('#qp') && !e.target.closest('[data-act="palette"],[data-act^="qp-"]')) closeQP();
  const el = e.target.closest('[data-act]');
  if (el && el.tagName !== 'A') { e.preventDefault(); if (el.matches(':disabled')) return; return act(el.dataset.act, el.dataset.arg, el, e); }
  const row = e.target.closest('[data-row]');
  if (row && !e.target.closest('a')) select(row.dataset.row);
});
document.addEventListener('contextmenu', e => {
  const el = e.target.closest('[data-ctx]');
  if (!el || !e.target.closest('#vsc')) return hideMenu();
  e.preventDefault();
  const kind = el.dataset.ctx;
  let arg = el.dataset.arg;
  if (kind === 'commit') { S.sel = arg; render(); }
  else if (kind === 'local' || kind === 'remote') { S.treeSel = arg; arg = arg.split(':').slice(1).join(':'); render(); }
  else if (kind === 'stash') { arg = arg.split(':')[1]; }
  showMenu(e.clientX, e.clientY, menuFor(kind, arg), kind === 'commit' ? 'webview/context' : 'menus › view/item/context');
});
document.addEventListener('input', e => {
  const t = e.target;
  if (t.id === 'q') { S.q = t.value; render(); }
  else if (t.id === 'scmmsg') { S.msg = t.value; if (S.msgErr) { S.msgErr = ''; render(); } }
  else if (t.id === 'qpin' && QP) { QP.value = t.value; if (QP.mode === 'pick') { QP.idx = 0; paintQP(); const i = $('#qpin'); i.focus(); i.setSelectionRange(i.value.length, i.value.length); } else if (QP.err) { QP.err = ''; } }
});
document.addEventListener('keydown', e => {
  if (QP && e.target.id === 'qpin') {
    if (e.key === 'Escape') { e.preventDefault(); return closeQP(); }
    if (e.key === 'Enter') { e.preventDefault(); return qpAccept(); }
    if (QP.mode === 'pick' && (e.key === 'ArrowDown' || e.key === 'ArrowUp')) {
      e.preventDefault(); QP.idx += e.key === 'ArrowDown' ? 1 : -1; const v = QP.value; paintQP(); const i = $('#qpin'); i.focus(); i.setSelectionRange(v.length, v.length); return;
    }
    return;
  }
  if (e.key === 'Escape') { if (!$('#scrim').hidden) return closeDialog(); if (!$('#menu').hidden) return hideMenu(); }
  if ((e.metaKey || e.ctrlKey) && e.shiftKey && (e.key === 'p' || e.key === 'P')) { e.preventDefault(); return act('palette'); }
  if ((e.metaKey || e.ctrlKey) && e.altKey && e.code === 'KeyG') { e.preventDefault(); return showGraph(); }
  if ((e.metaKey || e.ctrlKey) && e.key === 'Enter' && e.target.id === 'scmmsg') { e.preventDefault(); return commit(); }
  if (e.target.closest('input, textarea') || !$('#scrim').hidden) return;
  if (S.active === 'graph' && ['ArrowDown', 'ArrowUp', 'j', 'k'].includes(e.key)) {
    const ids = [...document.querySelectorAll('#graph [data-row]')].map(r => r.dataset.row);
    let i = ids.indexOf(S.sel); i += (e.key === 'ArrowDown' || e.key === 'j') ? 1 : -1;
    if (i >= 0 && i < ids.length) { e.preventDefault(); select(ids[i]); }
  }
});

if (innerWidth < 760) S.view = null;
render();
</script>
